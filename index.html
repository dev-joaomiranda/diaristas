<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Diaristas — Disponibilidade</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .container{max-width:860px;margin:32px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
    .card{border:1px solid #E5E7EB;border-radius:10px;padding:14px}
    .tag{display:inline-block;margin:2px 6px 0 0;padding:4px 8px;border-radius:999px;background:#EFF6FF;color:#1E40AF;font-size:12px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    .filters button{padding:8px 10px;border:1px solid #E5E7EB;border-radius:8px;background:#fff;cursor:pointer}
    .filters button.active{background:#134D9A;color:#fff;border-color:#134D9A}
    .muted{color:#6B7280;font-size:14px}
  </style>
</head>
<body>
  <main class="container">
    <h1>Aurora Diaristas — exemplo fictício</h1>
    <p class="muted">Lista demonstrativa de profissionais e seus dias disponíveis.</p>

    <section>
      <h2>Filtrar por dia</h2>
      <div id="filtros" class="filters" role="group" aria-label="Filtros por dia"></div>
    </section>

    <section aria-labelledby="lista-title">
      <h2 id="lista-title">Profissionais</h2>
      <div id="lista" class="grid"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
