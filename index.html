<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais Cadastrados</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Profissionais cadastrados</h1>

        <div class="filter-container">
            <button class="filter-btn active" data-day="Todos">Todos</button>
            <button class="filter-btn" data-day="Seg">Seg</button>
            <button class="filter-btn" data-day="Ter">Ter</button>
            <button class="filter-btn" data-day="Qua">Qua</button>
            <button class="filter-btn" data-day="Qui">Qui</button>
            <button class="filter-btn" data-day="Sex">Sex</button>
            <button class="filter-btn" data-day="Sab">Sab</button>
            <button class="filter-btn" data-day="Dom">Dom</button>
        </div>

        <div id="lista-profissionais">

            <div class="profissional-card" data-availability="Seg Qua Sex">
                <h3>Ana Souza</h3>
                <p>Fortaleza</p>
                <p>Diarista/Passadeira</p>
                <p class="availability-text"><strong>Disponibilidade:</strong> </p>
            </div>

            <div class="profissional-card" data-availability="Ter Qui Sab">
                <h3>Beatriz Lima</h3>
                <p>Caucaia</p>
                <p>Cozinheira/Diarista</p>
                <p class="availability-text"><strong>Disponibilidade:</strong> </p>
            </div>

            <div class="profissional-card" data-availability="Seg Ter Qui">
                <h3>Carla Nascimento</h3>
                <p>Maracanaú</p>
                <p>Babá/Cuidora de idoso</p>
                <p class="availability-text"><strong>Disponibilidade:</strong> </p>
            </div>

            <div class="profissional-card" data-availability="Qua Sex Dom">
                <h3>Daniela Alves</h3>
                <p>Fortaleza</p>
                <p>Diarista</p>
                <p class="availability-text"><strong>Disponibilidade:</strong> </p>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
